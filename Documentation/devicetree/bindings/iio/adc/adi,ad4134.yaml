%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/adc/adi,ad4134.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Analog Devices AD4134 ADC

maintainers:
  - Cosmin Tanislav <cosmin.tanislav@analog.com>

description: |
  The AD4134 is a quad channel, low noise, simultaneous sampling,
  precision analog-to-digital converter (ADC) that delivers on
  functionality, performance, and ease of use.

    https://www.analog.com/en/products/ad4134.html

$ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    oneOf:
      - const: adi,ad4134
      - items:
          - enum:
              - adi,ad7134
          - const: adi,ad4134

  reg:
    maxItems: 1

  spi-max-frequency:
    maximum: 1000000

  reset-gpios:
    maxItems: 1

  clocks:
    maxItems: 1
    description:
      Required external clock source. Can specify either an external clock or
      external crystal.

  clock-names:
    enum:
      - xtal1-xtal2
      - clkin
    default: clkin

  '#clock-cells':
    const: 0

  clock-output-names:
    maxItems: 1

  avdd5-supply:
    description: A 5V supply that powers the chip's analog circuitry.

  dvdd5-supply:
    description: A 5V supply that powers the chip's digital circuitry.

  iovdd-supply:
    description:
      A 1.8V supply that sets the logic levels for the digital interface pins.

  refin-supply:
    description:
      Additional supply used to reduce the noise contribution of the reference
      source to the overall ADC conversion accuracy.

  avdd1v8-supply:
    description: A 1.8V supply used by the analog circuitry.

  dvdd1v8-supply:
    description: A 1.8V supply used by the digital circuitry.

  clkvdd-supply:
    description: A 1.8V supply for the chip's clock management circuit.

  ldoin-supply:
    description:
      A 2.6V to 5.5V supply that generates 1.8V for AVDD1V8, DVDD1V8, and CLKVDD
      pins.

  odr-gpios:
    description:
      GPIO connected to ODR pin. Used to sample ADC data in minimum I/O mode.
    maxItems: 1

  adi,adc-frame:
    $ref: /schemas/types.yaml#/definitions/string
    enum: [ 16-bit, 16-bit+CRC, 24-bit, 24-bit+CRC ]
    default: 24-bit
    description:
      Describes how the ADC data packet should be configured. The data packet
      size is 16-bit when "16-bit" is selected, 24-bit when "16-bit+CRC" or
      "24-bit" are selected, and 32-bit when "24-bit+CRC" is set.

required:
  - compatible
  - reg
  - avdd5-supply
  - dvdd5-supply
  - iovdd-supply
  - refin-supply
  - clocks
  - clock-names

allOf:
  - if:
      not:
        required:
          - ldoin-supply
    then:
      required:
        - avdd1v8-supply
        - dvdd1v8-supply
        - clkvdd-supply

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    spi {
      #address-cells = <1>;
      #size-cells = <0>;

      adc@0 {
        compatible = "adi,ad4134";
        reg = <0>;

        spi-max-frequency = <1000000>;

        reset-gpios = <&gpio0 86 GPIO_ACTIVE_LOW>;

        clocks = <&sys_clk>;
        clock-names = "clkin";

        avdd5-supply = <&avdd5>;
        dvdd5-supply = <&dvdd5>;
        iovdd-supply = <&iovdd>;
        refin-supply = <&refin>;
        avdd1v8-supply = <&avdd1v8>;
        dvdd1v8-supply = <&dvdd1v8>;
        clkvdd-supply = <&clkvdd>;

        adi,adc-frame = "24-bit";
      };
    };
...
